services:
  # 汎用 HTTP モックサーバー (WireMock)
  wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock:/home/wiremock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/__admin/health"]
      interval: 1s
      timeout: 2s
      retries: 15

  # pack CLI でビルドされた Cloud Function コンテナ
  cloud-function:
    image: test-function:local
    ports:
      - "8080:8080"
    environment:
      - TARGET_ENDPOINT=http://wiremock:8080/
    depends_on:
      wiremock:
        condition: service_healthy
